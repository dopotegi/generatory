<style>
:root{ --card-w:60mm; --card-h:89mm; --gutter:5mm; --margin:12mm; --blue:#3300CC; --ink:#000; }
*{ box-sizing:border-box }
html, body{ margin:0; background:#fff; color:#000; font-family:'Khand',system-ui,sans-serif; }
.container{ max-width:1200px; margin:0 auto; padding:16px;}
h1{ font-weight:900; margin:6px 0 10px; }

.topbar{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin:10px 0; }
.topbar > *{ padding:9px 12px; border:1px solid #d0d6e6; border-radius:10px; background:#fff; }
.btn{ background:var(--blue); color:#fff; border-color:var(--blue); cursor:pointer; font-weight:800; }
input[type="range"]{ vertical-align:middle; width:180px; }
.badge{ display:inline-grid; grid-auto-flow:column; align-items:center; gap:.4rem; }
.badge input[type="checkbox"]{ width:18px; height:18px; }

table{ width:100%; border-collapse:collapse; border-radius:16px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06);}
th, td{ border-bottom:1px solid #eef1f6; padding:10px; vertical-align:top; }
th{ text-align:left; font-weight:700; color:#5c6b8a; }
textarea{ width:100%; min-height:44px; resize:vertical; padding:8px; border:1px solid #d0d6e6; border-radius:8px; font-family:'Khand',sans-serif; }

/* Cards */
.card{ width:var(--card-w); height:var(--card-h); border-radius:8mm; border:2px solid var(--ink); background:#fff;
        display:grid; grid-template-rows:auto 1fr auto; gap:4mm; padding:6mm 6mm 14mm; position:relative; page-break-inside:avoid; break-inside:avoid; }
.section{ border:0.8mm dashed #c7cbe2; border-radius:5mm; padding:3mm 4mm; display:grid; grid-template-rows:auto 1fr; gap:3mm; }
.banner{ display:flex; justify-content:center; }
.pill{ background:var(--blue); color:#fff; border:0.8mm solid var(--ink); padding:3mm 6mm; border-radius:1000px; font-weight:900; letter-spacing:.08em; }
.pill--outline{ background:#fff; color:var(--blue); border-color:var(--blue); }
.pill-kto{ background:var(--blue) !important; color:#fff !important; border-color:var(--ink) !important; }
.content{ font-size:5mm; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.35; }
.logoMark{ position:absolute; left:6mm; bottom:1.2mm; }
.logoMark img{ height:12mm; width:auto; }
.tinyIndex{ position:absolute; right:6mm; bottom:5mm; font-size:3.2mm; color:#9aa0b4; font-weight:700; }

#print{ display:none; }
.page{ width:210mm; height:297mm; padding:12mm; margin:0 auto; background:#fff;
        display:grid; grid-template-columns:repeat(3, var(--card-w)); grid-auto-rows:var(--card-h); gap:5mm;
        place-content:center; justify-content:center; align-content:center; break-after:page; position:relative; }
.page:last-child{ break-after:auto; }
.page.control-frame::before{ content:''; position:absolute; inset:12mm; border:0.25mm dashed rgba(200,0,0,.7); pointer-events:none; }

.backpage .card-back{ width:var(--card-w); height:var(--card-h); border-radius:8mm; border:2px solid var(--ink);
                       display:flex; align-items:center; justify-content:center; background:#fff; }
.backpage.hide-border .card-back{ border-color:#fff; }
.card-back img{ max-width:72%; max-height:72%; }

@media print{ @page{ size:A4; margin:0; } #ui{ display:none !important; } #print{ display:block; } }

/* Hints */
.hints details{ border:2px solid #5a35ff; border-radius:12px; padding:8px 10px; }
.hints summary{ list-style:none; cursor:pointer; font-weight:800; color:#5a35ff; display:inline-grid; grid-auto-flow:column; align-items:center; gap:.4rem; }
.hints summary::after{ content:'▾'; font-weight:900; }
.hints details[open] summary::after{ transform:rotate(180deg)}
.hints table{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:8px; }
.hints .left{ width:150px; color:#5a35ff; font-weight:800; white-space:nowrap; vertical-align:top; padding:6px 8px}
.hints .right{ white-space:nowrap; padding:6px 8px}
.hints code{ background:#fff; border:1px solid rgba(90,53,255,.2); border-radius:6px; padding:0 6px }
mjx-container{ display:inline-block; white-space:nowrap; font-size:1.05em }
</style>
</head>

  </table>
</div>

// helpers
function el(tag, attrs={}, ...children){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else e.setAttribute(k,v); });
  children.forEach(c=>{ if(c==null) return; if(typeof c==='string') e.appendChild(document.createTextNode(c)); else e.appendChild(c); });
  return e;
}
function wrapMathIfNeeded(text){
  const uniform = document.getElementById('optAllMath')?.checked;
  const hasDelims = /\\\(|\\\)|\$/.test(text);
  const hasMathTokens = /\\frac|\\sqrt|\^|_|\\cdot|\\pm|\\le|\\ge|\\neq/.test(text);
  const onlyDigits = /^\s*[0-9][0-9\s,\.]*\s*$/.test(text);
  if(!hasDelims && (hasMathTokens || (uniform && (onlyDigits)))) return "\\(" + text + "\\)";
  return text;
}
function parseLine2cols(line){
  const idxs = [line.indexOf(';'), line.indexOf(','), line.indexOf('\t'), line.indexOf('|')].filter(i=>i>=0);
  if(idxs.length===0) return [line.trim(), ''];
  const i = Math.min(...idxs);
  return [line.slice(0,i).trim(), line.slice(i+1).trim()];
}

// observe for MathJax
const mjObserver = new MutationObserver(()=>{ if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(); });
['print','rows','hintsBox'].forEach(id=>{const n=document.getElementById(id); mjObserver.observe(n, {childList:true, subtree:true});});

// tabela
const rowsT = document.getElementById('rows');
function addRow(q='', a=''){
  const tr = el('tr',{},
    el('td',{}, String(rowsT.children.length+1)),
    el('td',{}, el('textarea',{class:'q', placeholder:'KTO MA…'},)),
    el('td',{}, el('textarea',{class:'a', placeholder:'JA MAM…'},)),
    el('td',{class:'action-btns'}, el('button',{type:'button'}, '× Usuń'))
  );
  tr.querySelector('textarea.q').value=q;
  tr.querySelector('textarea.a').value=a;
  tr.querySelector('button').addEventListener('click',()=>{ tr.remove(); renumber(); });
  rowsT.appendChild(tr);
}
function renumber(){ [...rowsT.children].forEach((tr,i)=>tr.firstChild.textContent=String(i+1)); }
// start: 12 pustych
for(let i=0;i<12;i++) addRow();

// przyciski
document.getElementById('btnAdd').addEventListener('click',()=>addRow());
document.getElementById('btnShuffle').addEventListener('click',()=>{
  const arr=[...rowsT.children];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  rowsT.innerHTML=''; arr.forEach(tr=>rowsT.appendChild(tr)); renumber();
});

// wklej & csv
const dlg=document.getElementById('dlg'); const bulk=document.getElementById('bulk');
document.getElementById('btnPaste').addEventListener('click',()=>dlg.showModal());
document.getElementById('closeDlg').addEventListener('click',()=>dlg.close());
document.getElementById('btnLoad').addEventListener('click',()=>{
  const lines = bulk.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  rowsT.innerHTML=''; 
  lines.forEach(line=>{ const [q,a] = parseLine2cols(line); addRow(q,a); });
  renumber();
  dlg.close();
  build();
});
document.getElementById('fileCSV').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ bulk.value=r.result; dlg.showModal(); }; r.readAsText(f);
});

// options
const optFont=document.getElementById('optFont'); const optFontVal=document.getElementById('optFontVal');
optFont.addEventListener('input',()=>{ optFontVal.textContent=optFont.value+' mm'; document.querySelectorAll('.content').forEach(c=>c.style.fontSize=optFont.value+'mm'); });

// build (interleaved backs) + SHIFT
function build(){
  const data = [...rowsT.querySelectorAll('tr')].map(tr=>({
    q: tr.querySelector('textarea.q').value.trim(),
    a: tr.querySelector('textarea.a').value.trim()
  })).filter(x=>x.q||x.a);
  const print = document.getElementById('print'); print.innerHTML='';
  if(data.length===0) return;

  // przygotuj odpowiedzi (opcjonalny łańcuch)
  let answers = data.map(d=>d.a);
  if(document.getElementById('optShift').checked && answers.length>1){
    // przesunięcie o -1: karta i dostaje odpowiedź z elementu i-1; pierwsza karta dostaje ostatnią
    answers = [answers[answers.length-1], ...answers.slice(0, answers.length-1)];
  }

  const perPage = 9;
  for(let p=0; p<data.length; p+=perPage){
    const sliceQ = data.slice(p, p+perPage);
    const sliceA = answers.slice(p, p+perPage);

    const pageFront = el('div',{class:'page'+(document.getElementById('optCtrlFrame').checked?' control-frame':'')});
    sliceQ.forEach((d,i)=>{
      const idx = p+i;
      const card = el('div',{class:'card'+(document.getElementById('optBold').checked?' bold':'')},
        el('div',{class:'section'},
          el('div',{class:'banner'}, el('div',{class:'pill '+(document.getElementById('optOutline').checked?'pill--outline':'')},'JA MAM')),
          el('div',{class:'content', style:'font-size:'+optFont.value+'mm'}, el('span',{class:'tex'}, wrapMathIfNeeded(sliceA[i] ?? '')))
        ),
        el('div',{class:'section'},
          el('div',{class:'banner'}, el('div',{class:'pill pill-kto'},'KTO MA')),
          el('div',{class:'content', style:'font-size:'+optFont.value+'mm'}, el('span',{class:'tex'}, wrapMathIfNeeded(d.q)))
        ),
        el('div',{class:'logoMark'}, EMBED_LOGO? el('img',{src:EMBED_LOGO, alt:'logo'}): document.createTextNode('')),
        el('div',{class:'tinyIndex', style: (document.getElementById('optIndex').checked?'':'display:none;')}, String(idx+1))
      );
      pageFront.appendChild(card);
    });
    print.appendChild(pageFront);

    if(document.getElementById('optBacks').checked){
      const pageBack = el('div',{class:'page backpage'+(document.getElementById('optBackNoBorder').checked?' hide-border':'')});
      for(let i=0;i<sliceQ.length;i++){ pageBack.appendChild(el('div',{class:'card-back'}, EMBED_LOGO? el('img',{src:EMBED_LOGO, alt:'logo'}): document.createTextNode(''))); }
      print.appendChild(pageBack);
    }
  }

  if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

function getPdfTitle(){
  const raw = document.getElementById('pdfTitle')?.value?.trim() || 'Ja mam kto ma';
  return raw.replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim() || 'Ja mam kto ma';
}
function setPdfTitle(){
  const title = getPdfTitle();
  document.title = title;
  return title;
}
window.addEventListener('beforeprint', setPdfTitle);
document.getElementById('pdfTitle')?.addEventListener('input', setPdfTitle);
setPdfTitle();

document.getElementById('btnPreview').addEventListener('click', build);
document.getElementById('btnPDF').addEventListener('click', ()=>{
  build();
  setPdfTitle();
  setTimeout(()=>{ setPdfTitle(); window.print(); }, 50);
});
</script>
</body>
